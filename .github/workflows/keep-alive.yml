name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 3 * * 0,3'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping clinic database
        env:
          SUPABASE_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          URL="https://lozyfwydyrovxjtsgybn.supabase.co/rest/v1/patients?select=id&limit=1"
          curl -v -X GET "$URL" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY"
