name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check DNS resolution
        run: |
          getent hosts ggshgsyoytrkbnepsryu.supabase.co || echo "⚠️ DNS lookup failed here too"

      - name: Resume project if paused
        continue-on-error: true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          curl -X POST "https://api.supabase.com/v1/projects/ggshgsyoytrkbnepsryu/restore" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN"
          sleep 30

      - name: Ping clinic database
        env:
          SUPABASE_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          NOW=$(date -u +%FT%TZ)
          curl -v -f --retry 3 --retry-delay 15 \
            -X POST "https://ggshgsyoytrkbnepsryu.supabase.co/rest/v1/_keepalive" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: resolution=merge-duplicates" \
            -d "{\"id\":1,\"pinged_at\":\"$NOW\"}"


      - name: Ping clinic database
        env:
          SUPABASE_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          URL="https://ggshgsyoytrkbnepsryu.supabase.co/rest/v1/patients?select=id&limit=1"
          curl -v -f -X POST "https://ggshgsyoytrkbnepsryu.supabase.co/rest/v1/_keepalive" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \       
            -H "Content-Type: application/json" \
            -H "Prefer: resolution=merge-duplicates" \
            --retry 5 --retry-delay 15 --retry-all-errors \
            -d "{\"id\":1,\"pinged_at\":\"$(date -u +%FT%TZ)\"}"

      - name: Log run (keeps repo "active" so GitHub never disables the schedule)
        run: |
          echo "$(date -u +'%Y-%m-%d %H:%M UTC') ping ok" >> keepalive-log.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add keepalive-log.txt
          git commit -m "keepalive $(date -u +%F)" || echo "nothing to commit"
          git push
