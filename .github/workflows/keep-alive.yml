name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 3 * * 0,3'   # Sunday & Wednesday
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping clinic database
        run: |
          curl -sf "https://ggshgsyoytrkbnepsryu.supabase.co/rest/v1/patients?select=*&limit=1" \
            -H "apikey: ${{ secrets.CLINIC_SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.CLINIC_SUPABASE_ANON_KEY }}"
