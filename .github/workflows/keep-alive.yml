name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 3 * * 0,3'   # Sunday & Wednesday
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping clinic database
        run: |
          STATUS=$(curl -s -o response.txt -w "%{http_code}" \
            "https://ggshgsyoytrkbnepsryu.supabase.co/rest/v1/patients?select=id&limit=1" \
            -H "apikey: ${{ secrets.CLINIC_SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.CLINIC_SUPABASE_ANON_KEY }}")
          echo "HTTP status: $STATUS"
          echo "Response body:"
          cat response.txt
          if [ "$STATUS" -ge 400 ]; then exit 1; fi
      - name: Check secret length
        env:
          KEY: ${{ secrets.CLINIC_SUPABASE_ANON_KEY }}
        run: echo "Key length is ${#KEY} characters (should be 208)"
