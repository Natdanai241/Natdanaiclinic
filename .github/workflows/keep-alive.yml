name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 3 * * 0,3'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping clinic database
        run: |
          URL="https://lozyfwydyrovxjtsgybn.supabase.co/rest/v1/patients?select=id&limit=1"
          
          CODE=$(curl -s -o /tmp/out.txt -w "%{http_code}" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            "$URL")
            
          echo "HTTP status: $CODE"
          if [ "$CODE" = "200" ]; then
            echo "Success: Database is awake!"
          else
            echo "Error: Failed with status $CODE"
            exit 1
          fi
